# GitLab CI for VOIDFORGE.
# - pages: publishes the online practice copy at https://random21m.gitlab.io/voidforge/ from main: the released
#   voidforge.html byte for byte, inside the thin wrapper in demo/ (amber banner, icons, offline copy). It checks
#   SHA256SUMS and CID.txt first, so the demo can only ever serve the file those two name.
# - test: the unit, oracle and print tests, started by hand (the free plan has 400 CI minutes a month, and the
#   mutation suite takes hours, so the full suite, mutation tests included, runs before each release on the
#   maintainer's machine; see RELEASING.md). Run pipeline (Build > Pipelines) starts it at once on any branch.
# Pipelines are made only for main and for Run pipeline, so pushes of dev branches and tags leave no skipped entries.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
stages: [test, deploy]

test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
  script:
    - npm ci --ignore-scripts
    - node tests/test.js
    - node tests/oracle.test.mjs
    - node tests/print.test.mjs

pages:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache python3
    - sha256sum -c SHA256SUMS
    - test "$(python3 -c "import hashlib,base64; h=hashlib.sha256(open('voidforge.html','rb').read()).digest(); print('b'+base64.b32encode(bytes([1,0x55,0x12,0x20])+h).decode().lower().rstrip('='))")" = "$(cat CID.txt)"
    - mkdir public
    - cp demo/* public/
    - cp voidforge.html public/voidforge.html
    - sha256sum public/voidforge.html
  artifacts:
    paths: [public]
