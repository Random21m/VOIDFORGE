# GitHub Pages for VOIDFORGE (from v2.15.0; up to v2.14.0 this was the `pages` job in GitLab CI).
# Publishes the online practice copy at https://random21m.github.io/VOIDFORGE/ from main: the released voidforge.html
# byte for byte, inside the thin wrapper in demo/ (amber banner, icons, offline copy). It checks SHA256SUMS and CID.txt
# first, so the demo can only ever serve the file those two name.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# actions/checkout is pinned to the commit the project's GitHub workflows used up to v2.3.0. upload-pages-artifact and
# deploy-pages are on their major version tags for now: pin them to full commit SHAs (checked on GitHub) before relying on this.
name: pages
on:
  push:
    branches: [main]
  # Can also be started by hand (Actions > pages > Run workflow), for example after turning Pages on; it deploys only from main.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: voidforge.html matches SHA256SUMS and CID.txt
        run: |
          sha256sum -c SHA256SUMS
          test "$(python3 -c "import hashlib,base64; h=hashlib.sha256(open('voidforge.html','rb').read()).digest(); print('b'+base64.b32encode(bytes([1,0x55,0x12,0x20])+h).decode().lower().rstrip('='))")" = "$(cat CID.txt)"
      - name: Assemble the demo (demo/ plus the released voidforge.html, byte for byte)
        run: |
          mkdir public
          cp demo/* public/
          cp voidforge.html public/voidforge.html
          (cd public && sha256sum -c ../SHA256SUMS)
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
